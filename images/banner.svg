<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 300"
  width="100%"
  role="img"
  aria-labelledby="banner-title"
>
  <title id="banner-title">Banner</title>

  <!-- Cuadrícula -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#262626" />
    </pattern>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect
    width="900"
    height="300"
    rx="12"
    fill="url(#grad-bg)"
    stroke="#242424"
  />
  <rect x="480" y="20" width="400" height="230" fill="url(#grid)" />

  <!-- Textos -->
  <g font-family="Plus Jakarta Sans, Arial, sans-serif">
    <text x="40" y="65" font-size="12" letter-spacing="2" fill="#007eff">
      BACKEND · NETWORKS · DB
    </text>
    <text x="38" y="130" font-size="48" font-weight="700" fill="#f5f5f5">
      DiegoJes22
    </text>
    <text x="40" y="175" font-size="18" fill="#8c8c8c">
      Ingeniería en Sistemas Computacionales
    </text>
    <line x1="40" y1="235" x2="860" y2="235" stroke="#242424" />
    <text x="40" y="265" font-size="15" fill="#5c5c5c">
      Mi portafolio · Mi GitHub
    </text>
  </g>

  <!--Face-->
  <!--Aqui la cara debe estar posicionada a la izquierda y alineada verticalmente al centro-->
  <g transform="translate(500, 50) scale(0.5)">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 301 301"
      role="img"
      aria-label="animated-face"
      xmlns:c2pa="http://c2pa.org/manifest"
    >
      <defs>
        <radialGradient id="face-gradient" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="60%" stop-color="#DCE7F5" />
          <stop offset="100%" stop-color="#8CA5C8" />
        </radialGradient>
      </defs>

      <!-- Face BG -->
      <circle class="face" cx="150.5" cy="150.5" r="150.5" />

      <!-- Eyes -->
      <g class="look">
        <rect
          class="eye"
          x="92"
          y="71"
          width="25"
          height="100"
          rx="11"
          ry="11"
        />
        <rect
          class="eye"
          x="188"
          y="71"
          width="25"
          height="100"
          rx="11"
          ry="11"
        />
      </g>
      <style>
        :root {
          --blink-every: 3.5s; /* flicker time */
          --look-every: 8s; /* loop time    */
        }
        .face {
          fill: url(#face-gradient);
        }
        .eye {
          fill: #000000;
        }

        /* eyes move */
        .look {
          animation: look var(--look-every) ease-in-out infinite;
        }
        @keyframes look {
          0%,
          10% {
            transform: translate(0, 0);
          }
          20%,
          35% {
            transform: translate(-22px, 0);
          }
          45%,
          60% {
            transform: translate(22px, -8px);
          }
          70%,
          85% {
            transform: translate(0, 10px);
          }
          95%,
          100% {
            transform: translate(0, 0);
          }
        }

        /* flick effect */
        .eye {
          transform-box: fill-box;
          transform-origin: center;
          animation: blink var(--blink-every) infinite;
        }
        @keyframes blink {
          0%,
          92%,
          100% {
            transform: scaleY(1);
          }
          96% {
            transform: scaleY(0.08);
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .look,
          .eye {
            animation: none;
          }
        }
      </style>
    </svg>
  </g>
</svg>
